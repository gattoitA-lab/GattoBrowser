<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GattoBrowser — il browser di GattoHub</title>
<meta name="description" content="GattoBrowser: browser leggerissimo con GattoSearch, screenshot verso l'AI, GattoGuard e pagina iniziale personalizzabile. Creato da GattoHub.">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050505'/%3E%3Cpath d='M16 5l9 5v12l-9 5-9-5V10z' fill='%2300FF66'/%3E%3Cpath d='M16 5l9 5-9 5-9-5z' fill='%23b6ffd2'/%3E%3Cpath d='M16 15v12l-9-5V10z' fill='%2300c24d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=1.9">
</head>
<body>

<div id="app">
  <header id="chrome">
    <div id="tabsbar">
      <div class="tabbrand" title="GattoBrowser">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0d120f"/><path d="M16 5l9 5v12l-9 5-9-5V10z" fill="#00FF66"/><path d="M16 5l9 5-9 5-9-5z" fill="#b6ffd2"/><path d="M16 15v12l-9-5V10z" fill="#00c24d"/></svg>
      </div>
      <div id="tabs" role="tablist" aria-label="Schede"></div>
      <button id="newtab" data-act="newtab" title="Nuova scheda (Ctrl+T)" aria-label="Nuova scheda">+</button>
    </div>

    <div id="toolbar">
      <button class="tb-btn" data-act="back" id="back" title="Indietro (Alt+←)" aria-label="Indietro">‹</button>
      <button class="tb-btn" data-act="fwd" id="fwd" title="Avanti (Alt+→)" aria-label="Avanti">›</button>
      <button class="tb-btn" data-act="reload" title="Ricarica (F5)" aria-label="Ricarica">⟳</button>
      <button class="tb-btn" data-act="open-current-external" title="Apri questa pagina in una finestra dedicata" aria-label="Apri in finestra">↗</button>
      <button class="tb-btn" data-act="nav-home" title="Home" aria-label="Home">⌂</button>

      <div class="omni-wrap" id="omniWrap">
        <span class="site" id="omniIcon">🔍</span>
        <input id="omni" type="text" spellcheck="false" autocomplete="off" placeholder="Cerca con GattoSearch o digita un indirizzo (URL)" aria-label="Barra degli indirizzi e ricerca">
        <button class="omni-chip guard-on hidden" id="omniChip" data-act="guard-info" title="Stato protezione">🛡</button>
      </div>

      <button class="tb-btn" data-act="star" id="star" title="Aggiungi ai preferiti" aria-label="Aggiungi ai preferiti">☆</button>
      <button id="shotBtn" data-act="shot" title="Fai uno screenshot e portalo nell'AI"><span>📷</span><span class="lbl">Screenshot</span></button>
      <button class="tb-btn" data-act="menu" id="menuBtn" title="Menu di GattoBrowser" aria-label="Menu">⋮</button>
    </div>

    <div id="bookmarksbar"></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <footer id="statusbar">
    <span id="statusMsg">Pronto</span>
    <span class="sp"></span>
    <span id="guardState" class="ok hide-sm">GattoGuard attivo</span>
    <span id="zoomInfo" class="hide-sm">100%</span>
    <span id="memInfo">RAM n/d</span>
    <span class="hide-sm">v1.0</span>
  </footer>
</div>

<div id="findbar" class="hidden" role="search">
  <input id="findInput" type="text" placeholder="Trova nella pagina…" autocomplete="off">
  <span id="findCount">0/0</span>
  <button data-act="find-prev" title="Precedente">↑</button>
  <button data-act="find-next" title="Successivo">↓</button>
  <button data-act="find-close" title="Chiudi">✕</button>
</div>

<div id="suggest" class="dropdown hidden" role="listbox"></div>
<div id="menu" class="dropdown hidden" role="menu"></div>
<div id="modalRoot"></div>
<div id="toasts"></div>

<div id="playhubFx" aria-hidden="true">
  <div class="rings"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span></div>
  <div class="fx-particles" id="fxParticles"></div>
  <div class="fx-core">
    <span class="paw">🐾</span><span class="paw">🐾</span><span class="paw">🐾</span><span class="paw">🐾</span>
    <div class="biglogo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l11 6v14l-11 6-11-6V9z" fill="#04140a"/><path d="M16 8l7 4v9l-7 4-7-4v-9z" fill="#00FF66"/></svg></div>
    <h3>Entro su PlayHub…</h3>
    <div class="fx-bar"><i></i></div>
    <small>gattohub · connessione in corso</small>
  </div>
</div>

<script src="assets/app.js?v=1.9" defer></script>
<script src="assets/app-ui.js?v=1.9" defer></script>
<script src="assets/settings.js?v=1.9" defer></script>
<script src="assets/tools.js?v=1.9" defer></script>
<script src="assets/vault.js?v=1.9" defer></script>
</body>
</html>
